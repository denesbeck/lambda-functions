name: Deploy Lambda

on:
  push:
    branches:
      - main
      - "test/**"
      - "release/**"
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

# Actions pinned to SHAs; Dependabot keeps them current.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          severity: warning

  deploy-layers:
    needs: validate
    # Dependabot runs get the Dependabot secret store, not Actions secrets, so
    # they cannot authenticate to AWS — and a dependency bump should not deploy.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        region: [us-east-1, eu-central-1]

    environment: ${{ matrix.region }}

    env:
      LAYERS_S3_BUCKET: ${{ vars.LAYERS_S3_BUCKET }}
      REGION: ${{ matrix.region }}
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Get changed layer directories
        id: layer_dirs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          echo "Detecting changed layer directories..."
          DIRS=""

          # A new branch push has an all-zeros BEFORE_SHA; diffing against the
          # merge-base with main keeps it from republishing every layer.
          if git cat-file -e "$BEFORE_SHA"^{commit} &>/dev/null; then
            echo "Commit $BEFORE_SHA found."
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA=$(git merge-base origin/main "$AFTER_SHA" 2>/dev/null || true)
            echo "Commit $BEFORE_SHA NOT found. Using merge-base with origin/main: ${BASE_SHA:-none}"
          fi

          if [[ -n "$BASE_SHA" ]]; then
            DIRS=$(git diff --name-only "$BASE_SHA" "$AFTER_SHA" | awk -F/ '$1 == "layers" && NF>=2 && $1 !~ /^\./ && $2 !~ /^\./ {print $1 "/" $2}' | sort -u)
          else
            echo "No merge-base with origin/main. First commit — deploying all layers."
            DIRS=$(find . -mindepth 2 -maxdepth 2 -type d -not -path '*/.*' | cut -c 3- | sort -u | awk -F/ '$1 == "layers"')
          fi

          if [[ -z "$DIRS" ]]; then
            echo "No changed layer directories found. Skipping deployment."
          else
            echo "Changed layer directories:"
            echo "$DIRS"
            echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$DIRS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      # Layers are installed and zipped BEFORE AWS credentials exist in the job,
      # so package-manager lifecycle scripts (npm/pip/bundler) never run with
      # access to the deploy role's credentials.
      - name: Package layers
        if: steps.layer_dirs.outputs.dirs != ''
        env:
          LAYER_DIRS: ${{ steps.layer_dirs.outputs.dirs }}
        run: |
          set -euo pipefail

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

          while IFS= read -r path; do
            LAYER=$(basename "$path")

            CONFIG_FILE="${path}/config.json"
            if [[ ! -f "$CONFIG_FILE" ]]; then
              echo "WARNING: Missing config.json in $path, skipping..." >&2
              continue
            fi

            TYPE=$(jq -r .type "$CONFIG_FILE")
            ZIP_FILE="${LAYER}-${TIMESTAMP}-${COMMIT_SHA}.zip"

            echo "::group::Package layer: $LAYER"

            echo "Installing packages for $path..."
            cd "$path"
            ../../scripts/install-packages.sh "$TYPE"

            echo "Zipping $path..."
            zip -r "../../$ZIP_FILE" . > /dev/null
            cd - > /dev/null

            echo "::endgroup::"

          done <<< "$LAYER_DIRS"

      - name: Set up AWS credentials
        if: steps.layer_dirs.outputs.dirs != ''
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/GitHubActionsDeployRole
          aws-region: ${{ matrix.region }}

      - name: Upload and publish layers
        if: steps.layer_dirs.outputs.dirs != ''
        env:
          LAYER_DIRS: ${{ steps.layer_dirs.outputs.dirs }}
        run: |
          set -euo pipefail

          while IFS= read -r path; do
            LAYER=$(basename "$path")

            CONFIG_FILE="${path}/config.json"
            if [[ ! -f "$CONFIG_FILE" ]]; then
              continue
            fi

            LAYER_NAME=$(jq -r .name "$CONFIG_FILE")
            DESCRIPTION=$(jq -r .description "$CONFIG_FILE")
            COMPATIBLE_RUNTIMES=$(jq -r '.runtimes | join(" ")' "$CONFIG_FILE")

            ZIP_FILE="${LAYER}-${TIMESTAMP}-${COMMIT_SHA}.zip"
            S3_KEY="${LAYER}/${ZIP_FILE}"

            if [[ ! -f "$ZIP_FILE" ]]; then
              echo "WARNING: No package for $path, skipping..." >&2
              continue
            fi

            echo "::group::Deploy layer: $LAYER_NAME"

            echo "Uploading to s3://${LAYERS_S3_BUCKET}/${S3_KEY}"
            aws s3 cp --region "$REGION" "$ZIP_FILE" "s3://${LAYERS_S3_BUCKET}/${S3_KEY}"

            echo "Publishing new layer version..."
            ACCOUNT_NUMBER=$(aws sts get-caller-identity --query Account --output text)
            VERSION=$(aws lambda publish-layer-version \
              --layer-name "arn:aws:lambda:$REGION:$ACCOUNT_NUMBER:layer:$LAYER_NAME" \
              --description "$DESCRIPTION" \
              --content S3Bucket="$LAYERS_S3_BUCKET",S3Key="$S3_KEY" \
              --compatible-runtimes $COMPATIBLE_RUNTIMES \
              --region "$REGION" \
              --output text \
              --query 'Version')

            echo "Published version $VERSION of $LAYER_NAME"

            rm "$ZIP_FILE"
            echo "::endgroup::"

          done <<< "$LAYER_DIRS"

  deploy-functions:
    needs: [validate, deploy-layers]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        region: [us-east-1, eu-central-1]

    environment: ${{ matrix.region }}

    env:
      FUNCTIONS_S3_BUCKET: ${{ vars.FUNCTIONS_S3_BUCKET }}
      HASHES_S3_BUCKET: ${{ vars.HASHES_S3_BUCKET }}
      REGION: ${{ matrix.region }}
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/GitHubActionsDeployRole
          aws-region: ${{ matrix.region }}

      - name: Download previous hash files from S3
        run: |
          mkdir -p .hash-cache
          find functions -mindepth 2 -maxdepth 2 -type d | while read -r func_dir; do
            APP=$(basename "$(dirname "$func_dir")")
            FUNC=$(basename "$func_dir")
            TARGET=".hash-cache/functions/$APP/$FUNC"
            mkdir -p "$TARGET"
            aws s3 cp --region "$REGION" "s3://${HASHES_S3_BUCKET}/functions/$BRANCH/$APP-$FUNC.code.hash" "$TARGET/.code.hash" || true
            aws s3 cp --region "$REGION" "s3://${HASHES_S3_BUCKET}/functions/$BRANCH/$APP-$FUNC.config.hash" "$TARGET/.config.hash" || true
          done

      - name: Get Lambda directories
        id: function_dirs
        run: |
          echo "Detecting Lambda function directories..."

          DIRS=$(find . -mindepth 3 -maxdepth 3 -type d -not -path '*/.*' | cut -c 3- | sort -u | awk -F/ '$1 == "functions"')

          if [[ -z "$DIRS" ]]; then
            echo "No Lambda directories found. Skipping deployment."
          else
            echo "Lambda directories:"
            echo "$DIRS"
            echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$DIRS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate code and config hashes
        run: bash ./scripts/generate-function-hashes.sh

      - name: Deploy Lambda functions
        if: steps.function_dirs.outputs.dirs != ''
        env:
          FUNCTION_DIRS: ${{ steps.function_dirs.outputs.dirs }}
        run: |
          set -euo pipefail

          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          DEPLOY_ALIAS=$(./scripts/get-alias.sh "$BRANCH")
          echo "Branch '$BRANCH' will deploy to alias: $DEPLOY_ALIAS"

          while IFS= read -r path; do
            APP=$(echo "$path" | cut -d'/' -f2)
            LAMBDA=$(echo "$path" | cut -d'/' -f3)

            CONFIG_FILE="${path}/config.json"
            if [[ ! -f "$CONFIG_FILE" ]]; then
              echo "WARNING: Missing config.json in $path, skipping..." >&2
              continue
            fi

            echo "::group::Process $APP/$LAMBDA"

            source ./scripts/expand-config.sh "$CONFIG_FILE"

            CODE_HASH_FILE="$path/.code.hash"
            CONFIG_HASH_FILE="$path/.config.hash"
            LAST_HASH_PATH=".hash-cache/$path/.code.hash"
            LAST_CONFIG_HASH_FILE=".hash-cache/$path/.config.hash"
            DEPLOY_CODE=false
            UPDATE_CONFIG=false

            if [[ ! -f "$LAST_HASH_PATH" ]]; then
              echo "No previous code hash — will deploy"
              DEPLOY_CODE=true
            else
              CURRENT_HASH=$(cat "$CODE_HASH_FILE")
              LAST_HASH=$(cat "$LAST_HASH_PATH")

              if [[ "$CURRENT_HASH" != "$LAST_HASH" ]]; then
                echo "Hash changed — will deploy"
                DEPLOY_CODE=true
              else
                echo "Code unchanged — skipping zip and version publish"
              fi
            fi

            if [[ ! -f "$LAST_CONFIG_HASH_FILE" ]]; then
              echo "No previous config hash — will update config"
              UPDATE_CONFIG=true
            else
              CURRENT_CONFIG_HASH=$(cat "$CONFIG_HASH_FILE")
              LAST_CONFIG_HASH=$(cat "$LAST_CONFIG_HASH_FILE")
              if [[ "$CURRENT_CONFIG_HASH" != "$LAST_CONFIG_HASH" ]]; then
                echo "Config hash changed — will update config"
                UPDATE_CONFIG=true
              else
                echo "Config unchanged — skipping config update"
              fi
            fi

            if [[ "$DEPLOY_CODE" != true && "$UPDATE_CONFIG" != true ]]; then
              echo "::endgroup::"
              continue
            fi

            echo "Checking if Lambda function ${FUNCTION_NAME} exists..."
            if ! aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" >/dev/null 2>&1; then
              # Drop the local hash files so they are not uploaded — otherwise
              # the next push would see "unchanged" and never deploy.
              echo "ERROR: Lambda function ${FUNCTION_NAME} does not exist, skipping..." >&2
              rm -f "$CODE_HASH_FILE" "$CONFIG_HASH_FILE"
              echo "::endgroup::"
              continue
            fi

            if [[ "$DEPLOY_CODE" == true ]]; then
              ZIP_FILE="${APP}-${LAMBDA}-${TIMESTAMP}-${COMMIT_SHA}.zip"
              S3_KEY="${APP}/${LAMBDA}/${ZIP_FILE}"

              echo "Zipping $path to $ZIP_FILE"
              cd "$path"
              zip -r "../../../$ZIP_FILE" . -x "config.json" -x ".code.hash" -x ".config.hash" > /dev/null
              cd - > /dev/null

              echo "Uploading to s3://${FUNCTIONS_S3_BUCKET}/${S3_KEY}"
              aws s3 cp --region "$REGION" "$ZIP_FILE" "s3://${FUNCTIONS_S3_BUCKET}/${S3_KEY}"

              echo "Updating Lambda ${FUNCTION_NAME}..."
              aws lambda update-function-code \
                --function-name "$FUNCTION_NAME" \
                --s3-bucket "$FUNCTIONS_S3_BUCKET" \
                --s3-key "$S3_KEY" \
                --region "$REGION"

              aws lambda wait function-updated \
                --function-name "$FUNCTION_NAME" \
                --region "$REGION"

              rm "$ZIP_FILE"
            fi

            if [[ "$UPDATE_CONFIG" == true ]]; then
              # NOTE: layers only; runtime, handler, role and the rest of the
              # function configuration are owned by Terraform.
              echo "Updating layers for ${FUNCTION_NAME}..."
              if [[ -n "$LAYERS" ]]; then
                aws lambda update-function-configuration \
                  --function-name "$FUNCTION_NAME" \
                  --layers $LAYERS \
                  --region "$REGION"
              else
                aws lambda update-function-configuration \
                  --cli-input-json "{\"FunctionName\": \"${FUNCTION_NAME}\", \"Layers\": []}" \
                  --region "$REGION"
              fi

              aws lambda wait function-updated \
                --function-name "$FUNCTION_NAME" \
                --region "$REGION"
            fi

            # Publish and realias on config-only changes too, so layer updates
            # reach the aliased version and not just $LATEST.
            echo "Publishing new version for ${FUNCTION_NAME}..."
            VERSION=$(aws lambda publish-version \
              --function-name "$FUNCTION_NAME" \
              --region "$REGION" \
              --output text \
              --query 'Version')

            echo "Published version $VERSION"

            echo "Updating or creating alias '$DEPLOY_ALIAS'..."
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$DEPLOY_ALIAS" \
              --function-version "$VERSION" \
              --region "$REGION" || \
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$DEPLOY_ALIAS" \
              --function-version "$VERSION" \
              --region "$REGION"

            echo "::endgroup::"
          done <<< "$FUNCTION_DIRS"

      - name: Upload updated hash files to S3
        run: |
          find functions -type f \( -name ".code.hash" -o -name ".config.hash" \) | while read -r file; do
            APP=$(basename "$(dirname "$(dirname "$file")")")
            FUNC=$(basename "$(dirname "$file")")
            NAME=$(basename "$file")
            aws s3 cp "$file" "s3://${HASHES_S3_BUCKET}/functions/$BRANCH/$APP-$FUNC$NAME"
          done
